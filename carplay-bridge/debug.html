<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CarPlay Debug</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0d0d0d;
      color: #e0e0e0;
      font-family: 'Courier New', monospace;
      font-size: 13px;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    header {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 12px 16px;
      background: #161616;
      border-bottom: 1px solid #2a2a2a;
      flex-shrink: 0;
    }

    h1 { font-size: 15px; color: #fff; letter-spacing: 0.04em; }

    #status {
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: bold;
      background: #333;
      color: #888;
    }
    #status.connected { background: #1a3a1a; color: #1db954; }
    #status.error     { background: #3a1a1a; color: #e05555; }

    .filters {
      display: flex;
      gap: 6px;
      margin-left: auto;
    }

    .filter-btn {
      padding: 3px 10px;
      border-radius: 4px;
      border: 1px solid #333;
      background: #1a1a1a;
      color: #888;
      cursor: pointer;
      font-size: 11px;
    }
    .filter-btn.active { border-color: #1db954; color: #1db954; background: #0d1f12; }

    button#clear-btn {
      margin-left: 8px;
      padding: 3px 10px;
      border-radius: 4px;
      border: 1px solid #333;
      background: #1a1a1a;
      color: #666;
      cursor: pointer;
      font-size: 11px;
    }
    button#clear-btn:hover { color: #ccc; border-color: #555; }

    .main {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* Live log panel */
    #log {
      flex: 1;
      overflow-y: auto;
      padding: 8px 0;
    }

    .entry {
      display: flex;
      gap: 0;
      padding: 3px 16px;
      border-bottom: 1px solid #181818;
      align-items: flex-start;
      cursor: pointer;
    }
    .entry:hover { background: #1a1a1a; }

    .ts {
      color: #444;
      width: 80px;
      flex-shrink: 0;
      padding-top: 1px;
    }

    .badge {
      width: 90px;
      flex-shrink: 0;
      padding: 1px 6px;
      border-radius: 3px;
      font-size: 11px;
      font-weight: bold;
      text-align: center;
      margin-right: 10px;
    }

    .badge-plugged    { background: #0d3a1a; color: #1db954; }
    .badge-unplugged  { background: #3a1a0d; color: #e07a35; }
    .badge-media      { background: #0d1a3a; color: #4d9de0; }
    .badge-albumart   { background: #2a0d3a; color: #b04de0; }
    .badge-audio      { background: #1a1a0d; color: #c0c030; }
    .badge-video      { background: #0d2a2a; color: #30b0b0; }
    .badge-command    { background: #2a1a0d; color: #c08030; }
    .badge-failure    { background: #3a0d0d; color: #e04040; }

    .payload {
      flex: 1;
      white-space: pre-wrap;
      word-break: break-all;
      color: #bbb;
      line-height: 1.5;
    }

    .payload .key   { color: #6a9fd8; }
    .payload .str   { color: #98c379; }
    .payload .num   { color: #d19a66; }
    .payload .bool  { color: #c678dd; }

    /* Side panel — current state */
    #state-panel {
      width: 280px;
      border-left: 1px solid #2a2a2a;
      background: #111;
      overflow-y: auto;
      padding: 14px;
      flex-shrink: 0;
    }

    #state-panel h2 {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: #555;
      margin-bottom: 12px;
    }

    .state-section {
      margin-bottom: 16px;
    }

    .state-section h3 {
      font-size: 11px;
      color: #444;
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .state-row {
      display: flex;
      justify-content: space-between;
      padding: 3px 0;
      border-bottom: 1px solid #1a1a1a;
      gap: 8px;
    }

    .state-key { color: #555; flex-shrink: 0; }
    .state-val { color: #ccc; text-align: right; word-break: break-all; }
    .state-val.green { color: #1db954; }
    .state-val.red   { color: #e04040; }

    #albumart-preview {
      width: 100%;
      aspect-ratio: 1;
      object-fit: cover;
      border-radius: 6px;
      margin-top: 8px;
      background: #1a1a1a;
      display: none;
    }

    .count-badge {
      font-size: 10px;
      color: #444;
      float: right;
    }
  </style>
</head>
<body>

<header>
  <h1>CarPlay Debug</h1>
  <div id="status">Connecting…</div>
  <div class="filters">
    <button class="filter-btn active" data-type="all">All</button>
    <button class="filter-btn" data-type="media">Media</button>
    <button class="filter-btn" data-type="albumart">Art</button>
    <button class="filter-btn" data-type="audio">Audio</button>
    <button class="filter-btn" data-type="video">Video</button>
    <button class="filter-btn" data-type="command">Command</button>
  </div>
  <button id="clear-btn">Clear</button>
</header>

<div class="main">
  <div id="log"></div>

  <div id="state-panel">
    <h2>Current State</h2>

    <div class="state-section">
      <h3>Connection</h3>
      <div class="state-row">
        <span class="state-key">dongle</span>
        <span class="state-val" id="s-connected">—</span>
      </div>
    </div>

    <div class="state-section">
      <h3>Spotify / Now Playing</h3>
      <div class="state-row">
        <span class="state-key">title</span>
        <span class="state-val" id="s-title">—</span>
      </div>
      <div class="state-row">
        <span class="state-key">artist</span>
        <span class="state-val" id="s-artist">—</span>
      </div>
      <div class="state-row">
        <span class="state-key">album</span>
        <span class="state-val" id="s-album">—</span>
      </div>
      <div class="state-row">
        <span class="state-key">status</span>
        <span class="state-val" id="s-status">—</span>
      </div>
      <div class="state-row">
        <span class="state-key">position</span>
        <span class="state-val" id="s-position">—</span>
      </div>
      <div class="state-row">
        <span class="state-key">duration</span>
        <span class="state-val" id="s-duration">—</span>
      </div>
      <div class="state-row">
        <span class="state-key">app</span>
        <span class="state-val" id="s-app">—</span>
      </div>
    </div>

    <div class="state-section">
      <h3>Album Art</h3>
      <div class="state-row">
        <span class="state-key">received</span>
        <span class="state-val" id="s-art-status">—</span>
      </div>
      <img id="albumart-preview" alt="album art">
    </div>

    <div class="state-section">
      <h3>Packet Counts</h3>
      <div class="state-row">
        <span class="state-key">media</span>
        <span class="state-val" id="c-media">0</span>
      </div>
      <div class="state-row">
        <span class="state-key">albumart</span>
        <span class="state-val" id="c-albumart">0</span>
      </div>
      <div class="state-row">
        <span class="state-key">audio chunks</span>
        <span class="state-val" id="c-audio">0</span>
      </div>
      <div class="state-row">
        <span class="state-key">video frames</span>
        <span class="state-val" id="c-video">0</span>
      </div>
      <div class="state-row">
        <span class="state-key">commands</span>
        <span class="state-val" id="c-command">0</span>
      </div>
    </div>
  </div>
</div>

<script>
  const log = document.getElementById('log')
  const statusEl = document.getElementById('status')
  let activeFilter = 'all'
  let counts = { media: 0, albumart: 0, audio: 0, video: 0, command: 0 }
  let totalEntries = 0
  const MAX_ENTRIES = 300

  // Track state
  let state = {
    title: null, artist: null, album: null,
    status: null, position: null, duration: null, app: null,
  }

  function ms(ms) {
    const s = Math.floor(ms / 1000)
    return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`
  }

  function updateStatePanel(type, data) {
    if (type === 'plugged') {
      document.getElementById('s-connected').textContent = 'plugged'
      document.getElementById('s-connected').className = 'state-val green'
    } else if (type === 'unplugged') {
      document.getElementById('s-connected').textContent = 'unplugged'
      document.getElementById('s-connected').className = 'state-val red'
      ;['s-title','s-artist','s-album','s-status','s-position','s-duration','s-app'].forEach(id => {
        document.getElementById(id).textContent = '—'
      })
    } else if (type === 'media') {
      const d = data || {}
      const title = d.MediaLyrics || d.MediaSongName
      if (title)              { state.title    = title;                     document.getElementById('s-title').textContent    = title }
      if (d.MediaArtistName)  { state.artist   = d.MediaArtistName;        document.getElementById('s-artist').textContent   = d.MediaArtistName }
      if (d.MediaAlbumName)   { state.album    = d.MediaAlbumName;         document.getElementById('s-album').textContent    = d.MediaAlbumName }
      if (d.MediaAPPName)     { state.app      = d.MediaAPPName;           document.getElementById('s-app').textContent      = d.MediaAPPName }
      if (d.MediaSongPlayTime != null) {
        state.position = d.MediaSongPlayTime
        document.getElementById('s-position').textContent = ms(d.MediaSongPlayTime)
      }
      if (d.MediaSongDuration != null) {
        state.duration = d.MediaSongDuration
        document.getElementById('s-duration').textContent = ms(d.MediaSongDuration)
      }
      if (d.MediaPlayStatus != null) {
        const label = d.MediaPlayStatus === 1 ? 'playing' : d.MediaPlayStatus === 2 ? 'paused' : 'stopped'
        state.status = label
        document.getElementById('s-status').textContent = label
      }
    } else if (type === 'albumart') {
      const img = document.getElementById('albumart-preview')
      img.src = 'data:image/jpeg;base64,' + data
      img.style.display = 'block'
      document.getElementById('s-art-status').textContent = 'yes'
      document.getElementById('s-art-status').className = 'state-val green'
    }
  }

  function syntaxHighlight(obj) {
    const json = JSON.stringify(obj, null, 2)
    return json.replace(/("(\\u[a-zA-Z0-9]{4}|\\[^u]|[^\\"])*"(\s*:)?|\b(true|false|null)\b|-?\d+(?:\.\d*)?(?:[eE][+\-]?\d+)?)/g, (match) => {
      if (/^"/.test(match)) {
        if (/:$/.test(match)) return `<span class="key">${match}</span>`
        return `<span class="str">${match}</span>`
      }
      if (/true|false/.test(match)) return `<span class="bool">${match}</span>`
      return `<span class="num">${match}</span>`
    })
  }

  function addEntry(type, data) {
    const now = new Date()
    const ts = `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}:${String(now.getSeconds()).padStart(2,'0')}.${String(now.getMilliseconds()).padStart(3,'0')}`

    // For high-frequency types, just count — don't flood the log
    if (type === 'audio' || type === 'video') {
      counts[type]++
      document.getElementById(`c-${type}`).textContent = counts[type]
      return
    }

    if (counts[type] !== undefined) {
      counts[type]++
      const el = document.getElementById(`c-${type}`)
      if (el) el.textContent = counts[type]
    }

    const entry = document.createElement('div')
    entry.className = 'entry'
    entry.dataset.type = type

    let payloadStr = ''
    if (type === 'albumart') {
      payloadStr = `<span class="str">"[JPEG base64, ${Math.round(data.length * 0.75 / 1024)}KB]"</span>`
    } else if (data !== undefined) {
      payloadStr = syntaxHighlight(data)
    }

    entry.innerHTML = `
      <span class="ts">${ts}</span>
      <span class="badge badge-${type}">${type}</span>
      <span class="payload">${payloadStr}</span>
    `

    if (activeFilter !== 'all' && activeFilter !== type) {
      entry.style.display = 'none'
    }

    const atBottom = log.scrollHeight - log.scrollTop - log.clientHeight < 60
    log.appendChild(entry)
    if (atBottom) log.scrollTop = log.scrollHeight

    // Cap entries to avoid memory growth
    totalEntries++
    if (totalEntries > MAX_ENTRIES) {
      const first = log.querySelector('.entry')
      if (first) { log.removeChild(first); totalEntries-- }
    }
  }

  // Filter buttons
  document.querySelectorAll('.filter-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'))
      btn.classList.add('active')
      activeFilter = btn.dataset.type
      document.querySelectorAll('.entry').forEach(e => {
        e.style.display = (activeFilter === 'all' || e.dataset.type === activeFilter) ? 'flex' : 'none'
      })
    })
  })

  document.getElementById('clear-btn').addEventListener('click', () => {
    log.innerHTML = ''
    totalEntries = 0
  })

  // WebSocket
  function connect() {
    const ws = new WebSocket('ws://localhost:4000')

    ws.onopen = () => {
      statusEl.textContent = 'Connected'
      statusEl.className = 'connected'
      addEntry('plugged', undefined)
    }

    ws.onclose = () => {
      statusEl.textContent = 'Disconnected — retrying…'
      statusEl.className = 'error'
      setTimeout(connect, 2000)
    }

    ws.onerror = () => {
      statusEl.textContent = 'Error'
      statusEl.className = 'error'
    }

    ws.onmessage = (e) => {
      try {
        const msg = JSON.parse(e.data)
        updateStatePanel(msg.type, msg.data)
        addEntry(msg.type, msg.type === 'albumart' ? msg.data : msg.data)
      } catch {}
    }
  }

  connect()
</script>
</body>
</html>
